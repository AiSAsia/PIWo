<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ToDo List</title>
        <link rel="stylesheet" href="style.css" />
        <script defer src="script.js"></script>
    </head>
    <body>
        <div class="container">
            <h1>
                ToDo List
                <span id="toggleDarkMode" class="darkmode-icon">🌙</span>
            </h1>

            <div class="input-section">
                <input type="text" id="taskInput"
                    placeholder="Wpisz nowe zadanie..." />
                <select id="listSelector"></select>
                <button id="addTaskBtn">Dodaj</button>
            </div>

            <div class="search-section">
                <input type="text" id="searchInput" placeholder="Szukaj..." />
                <label><input type="checkbox" id="caseInsensitive" checked />
                    Ignoruj wielkość liter</label>
            </div>

            <div id="listsContainer"></div>

            <!-- Modal -->
            <div id="modal" class="modal">
                <div class="modal-content">
                    <p id="modalText"></p>
                    <button id="confirmDelete">Usuń</button>
                    <button id="cancelDelete">Anuluj</button>
                </div>
            </div>
        </div>
    </body>
</html>
